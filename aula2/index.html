<body>

  <h1>Consulta de Dados</h1>
  <div class="controles">
    <label for="recurso">O que deseja consultar?</label>
    <br><br>

    <select id="recurso">
      <option value="">-- Selecione --</option>
      <option value="musicas">Músicas</option>
      <option value="esportes">Esportes</option>
      <option value="animal">Animal</option>
      <option value="filmes_e_series">Filmes e Series</option>
      <option value="comida">Comida</option>
    </select>

    <button id="btn-consultar">Consultar</button>
  </div>

  <div id="resultado">
    <p class="vazio">Nenhuma consulta realizada ainda.</p>
  </div>

  <script>
   
    const FONTES = {
      comida: 	'https://api.jsonbin.io/v3/b/6abb0164ffd5d1605339a22a',
      musicas:  	'https://api.jsonbin.io/v3/b/6abb00c2ac6210605a000279',
      esportes: 	'https://api.jsonbin.io/v3/b/6abaffbfffd5d16053399b64',
      animal:	'https://api.jsonbin.io/v3/b/6abb00a4ac6210605a0001d2',
      filmes_e_series: 'https://api.jsonbin.io/v3/b/6abb00a9ac6210605a0001ee'
    };

    const selectRecurso  = document.getElementById('recurso');
    const btnConsultar   = document.getElementById('btn-consultar');
    const divResultado   = document.getElementById('resultado');

 
    function renderizarLista(dados) {
      if (!dados || dados.length === 0) {
        divResultado.innerHTML = '<p class="vazio">Nenhum registro encontrado.</p>';
        return;
      }

      const ul = document.createElement('ul');

      dados.forEach(item => {
        const li = document.createElement('li');

        // Monta "chave: valor | chave: valor | ..."
        const texto = Object.entries(item)
          .map(([chave, valor]) => `<strong>${chave}:</strong> ${valor}`)
          .join(' | ');

        li.innerHTML = texto;
        ul.appendChild(li);
      });

      divResultado.innerHTML = '';
      divResultado.appendChild(ul);
    }

    async function consultar() {
      const recurso = selectRecurso.value;
      
      if (!recurso) {
        divResultado.innerHTML = '<p class="erro">Escolha um recurso antes de consultar.</p>';
        return;
      }
      
      divResultado.innerHTML = '<p class="vazio">Consultando...</p>';
      const arquivo = FONTES[recurso];

      try {
        const resposta = await fetch(arquivo);

        if (!resposta.ok) {
          throw new Error(`HTTP ${resposta.status}`);
        }
        
        const jsonResponse = await resposta.json();
        
        // CORREÇÃO: Se existir a propriedade 'record' (padrão do JSONBin), usamos ela. Senão, usamos o JSON direto.
        const dados = jsonResponse.record ? jsonResponse.record : jsonResponse;

        renderizarLista(dados);

      } catch (erro) {
        divResultado.innerHTML = `<p class="erro">Erro ao consultar: ${erro.message}</p>`;
      }
    }

  
    btnConsultar.addEventListener('click', consultar);

  </script>

</body>
</html>
